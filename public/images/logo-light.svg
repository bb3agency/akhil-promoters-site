<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 90" fill="none">
  <!-- Pentagon / House Icon (same shape, white version) -->
  <g transform="translate(0, 0)">
    <!-- Main white pentagon house shape for dark backgrounds -->
    <path d="M42 4 L78 26 L78 68 L6 68 L6 26 Z" fill="white"/>
    <!-- Grey accent block bottom-right of pentagon -->
    <path d="M62 68 L78 68 L78 52 Z" fill="#aaaaaa"/>
    <!-- Red inner house outline (small house silhouette inside) -->
    <path d="M42 18 L60 30 L60 52 L24 52 L24 30 Z" fill="none" stroke="#C8102E" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="35" y="37" width="14" height="15" fill="#C8102E"/>
  </g>

  <!-- AKHIL text (white) -->
  <text x="90" y="44"
    font-family="'Arial Black', 'Arial', sans-serif"
    font-weight="900"
    font-size="26"
    letter-spacing="1"
    fill="white">AKHIL</text>

  <!-- PROMOTERS text (white) -->
  <text x="90" y="64"
    font-family="'Arial', sans-serif"
    font-weight="600"
    font-size="14"
    letter-spacing="3"
    fill="rgba(255,255,255,0.85)">PROMOTERS</text>
</svg>
